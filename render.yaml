# Render (Blueprint): o worker do Multistreams como serviço web.
# No painel do Render: New → Blueprint → escolha este repositório. As chaves (sync: false)
# são pedidas na criação e ficam só no Render, nunca no repositório.
# Plano free: dorme depois de 15 min sem acesso e leva ~1 min para acordar (mais que os 25 s do app).
# Um monitor de uptime chamando /health a cada 5 min o mantém acordado; se ele parar, param o polling
# e o push (README, "Worker no Render").
services:
  - type: web
    name: multistreams-worker
    runtime: node
    plan: free
    region: virginia # costa leste dos EUA: a mais perto do Brasil entre as do Render
    rootDir: worker
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://kdlasnfgknjnkplconkk.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
